#
# Common commands (run from the plugin root directory):
#   pb_tool deploy   — copy plugin into your QGIS profile plugins folder
#   pb_tool zip      — create monitoring_networks.zip for Install from ZIP
#   pb_tool clean    — remove compiled UI/resource artifacts (none currently)
#   pb_tool validate — check this config file
#

[plugin]
# Directory name created under .../python/plugins/
name: monitoring_networks

# Leave empty to use the default QGIS plugins path for this OS
plugin_path:

[files]
# Python modules required at runtime
python_files: __init__.py monitoring_networks_core.py monitoring_networks_dialog.py monitoring_networks_analysis.py

# No Qt Designer .ui file (UI is built in Python)
main_dialog:

# No additional compiled .ui files
compiled_ui_files:

# No .qrc resources (icon.png is loaded from disk via os.path)
resource_files:

# Non-Python files packaged with the plugin
extras: metadata.txt icon.png README.md LICENSE requirements.txt

# Extra subdirectories to copy as-is (i18n is handled via locales below)
extra_dirs:

# Translation locale(s). Expects i18n/monitoring_networks_es.ts (+ .qm after compile)
locales: es

[help]
# Sphinx help output if you build docs under help/; optional for this plugin
dir: help/build/html
target: help
